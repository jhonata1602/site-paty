<svg xmlns="http://www.w3.org/2000/svg" width="390" height="120" viewBox="0 0 390 120" role="img" aria-labelledby="title desc">
  <title id="title">FAST Drywall &amp; Steel Frame</title>
  <desc id="desc">Logo FAST com símbolo vermelho, FAST preto e Drywall &amp; Steel Frame em vermelho</desc>
  <defs>
    <linearGradient id="logoRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef2a2a"/>
      <stop offset="0.48" stop-color="#c40f18"/>
      <stop offset="1" stop-color="#7b0710"/>
    </linearGradient>
    <linearGradient id="logoRed2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3535"/>
      <stop offset="0.58" stop-color="#c90f18"/>
      <stop offset="1" stop-color="#850810"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#4b0000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g transform="translate(7 7)" filter="url(#shadow)">
    <path d="M53 0 L106 53 L53 106 L0 53 Z" fill="url(#logoRed)"/>
    <path d="M53 10 L96 53 L53 96 L10 53 Z" fill="#9f0b13" opacity="0.95"/>
    <path d="M53 4 L102 53 L53 102 L4 53 Z" fill="none" stroke="#e31a22" stroke-width="6"/>
    <path d="M53 2 V36 L36 53 L53 70 V104" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M38 53 L53 38 L68 53 L53 68 Z" fill="url(#logoRed2)" opacity="0.95"/>
  </g>

  <g transform="translate(128 5)">
    <text x="0" y="65" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', Arial, sans-serif" font-size="73" font-weight="900" fill="#0b0b0b" letter-spacing="-1.5">FAST</text>
    <text x="3" y="88" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#d71920">Drywall &amp;</text>
    <text x="3" y="110" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#d71920">Steel Frame</text>
  </g>
</svg>