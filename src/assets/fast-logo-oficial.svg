<svg xmlns="http://www.w3.org/2000/svg" width="520" height="170" viewBox="0 0 520 170" role="img" aria-labelledby="title desc">
  <title id="title">FAST Drywall &amp; Steel Frame</title>
  <desc id="desc">Logo oficial FAST com símbolo vermelho, nome FAST preto e subtítulo vermelho</desc>
  <defs>
    <linearGradient id="redOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff1b1b"/>
      <stop offset="0.52" stop-color="#c81018"/>
      <stop offset="1" stop-color="#7d0710"/>
    </linearGradient>
    <linearGradient id="redInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3a32"/>
      <stop offset="0.55" stop-color="#d51018"/>
      <stop offset="1" stop-color="#8f0911"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#510000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g transform="translate(10 10)" filter="url(#softShadow)">
    <path d="M67 0 L134 67 L67 134 L0 67 Z" fill="url(#redOuter)"/>
    <path d="M67 15 L119 67 L67 119 L15 67 Z" fill="#a50b13" opacity="0.92"/>
    <path d="M67 6 L128 67 L67 128 L6 67 Z" fill="none" stroke="#ed1c24" stroke-width="8"/>
    <path d="M67 4 V47 L47 67 L67 87 V130" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M49 67 L67 49 L86 67 L67 86 Z" fill="url(#redInner)" opacity="0.9"/>
  </g>

  <g transform="translate(162 15)">
    <text x="0" y="84" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', Arial, sans-serif" font-size="92" font-weight="900" fill="#111111" letter-spacing="-2">FAST</text>
    <text x="4" y="118" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#b91c1c">Drywall &amp;</text>
    <text x="4" y="150" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#b91c1c">Steel Frame</text>
  </g>
</svg>