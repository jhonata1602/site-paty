<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Perfis e acessórios para drywall e steel frame</title>
  <desc id="desc">Composição premium com perfis metálicos galvanizados, parafusos, fita e acessórios de montagem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111318"/>
      <stop offset="0.55" stop-color="#20242b"/>
      <stop offset="1" stop-color="#090b0e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#737b84"/>
      <stop offset="0.18" stop-color="#f2f5f7"/>
      <stop offset="0.42" stop-color="#8d969f"/>
      <stop offset="0.7" stop-color="#e2e6e9"/>
      <stop offset="1" stop-color="#59616a"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30363d"/>
      <stop offset="0.48" stop-color="#aeb6bd"/>
      <stop offset="1" stop-color="#3c444d"/>
    </linearGradient>
    <radialGradient id="glow" cx="40%" cy="28%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <ellipse cx="600" cy="715" rx="520" ry="58" fill="#000" opacity=".28"/>

  <!-- stacked galvanized profiles -->
  <g filter="url(#shadow)" transform="translate(85 70)">
    <g transform="rotate(-3 430 250)">
      <path d="M35 80 H850 L900 120 H130 L105 190 H820 L858 230 H70 L18 188 Z" fill="url(#steel)"/>
      <path d="M105 190 H820 L858 230 H70 Z" fill="#40474f" opacity=".85"/>
      <path d="M35 80 H850 L900 120 H130 Z" fill="#d7dde1" opacity=".35"/>
      <path d="M140 145 H780" stroke="#f8fafb" stroke-opacity=".45" stroke-width="6"/>
    </g>

    <g transform="translate(15 115) rotate(2 430 250)">
      <path d="M70 125 H820 L860 165 H145 L120 235 H790 L830 275 H82 L35 232 Z" fill="url(#steelDark)"/>
      <path d="M120 235 H790 L830 275 H82 Z" fill="#272c31" opacity=".86"/>
      <path d="M70 125 H820 L860 165 H145 Z" fill="#eef2f4" opacity=".25"/>
      <path d="M170 194 H745" stroke="#f7f9fb" stroke-opacity=".32" stroke-width="5"/>
    </g>

    <g transform="translate(55 250) rotate(-1 430 250)">
      <path d="M50 100 H720 L760 140 H122 L98 205 H690 L730 245 H65 L20 202 Z" fill="url(#steel)"/>
      <path d="M98 205 H690 L730 245 H65 Z" fill="#3a4148" opacity=".88"/>
      <path d="M50 100 H720 L760 140 H122 Z" fill="#f2f5f7" opacity=".22"/>
    </g>
  </g>

  <!-- tape roll -->
  <g transform="translate(890 112)" filter="url(#smallShadow)">
    <ellipse cx="115" cy="78" rx="110" ry="62" fill="#dedbd2"/>
    <ellipse cx="115" cy="78" rx="67" ry="37" fill="#aaa79e"/>
    <ellipse cx="115" cy="78" rx="46" ry="25" fill="#1a1d22"/>
    <path d="M18 78 V152 C18 187 212 187 212 152 V78 C188 117 44 117 18 78Z" fill="#cfcac0"/>
    <ellipse cx="115" cy="152" rx="97" ry="48" fill="#beb9ae"/>
    <ellipse cx="115" cy="152" rx="49" ry="24" fill="#21252a" opacity=".75"/>
  </g>

  <!-- yellow utility knife -->
  <g transform="translate(835 330) rotate(7 150 35)" filter="url(#smallShadow)">
    <rect x="40" y="22" width="300" height="58" rx="22" fill="#f4a300"/>
    <rect x="105" y="31" width="175" height="40" rx="16" fill="#14171c"/>
    <rect x="0" y="33" width="92" height="36" rx="10" fill="#c9cfd4"/>
    <path d="M0 33 L75 51 L0 69 Z" fill="#f4f6f7"/>
    <circle cx="295" cy="51" r="12" fill="#24282e"/>
  </g>

  <!-- screws -->
  <g fill="url(#steel)" stroke="#333a42" stroke-width="2" filter="url(#smallShadow)">
    <g transform="translate(715 555) rotate(-18)">
      <rect x="0" y="0" width="155" height="16" rx="8"/>
      <circle cx="7" cy="8" r="16"/>
      <path d="M7 1 V15 M0 8 H14" stroke="#20252a" stroke-width="3"/>
      <path d="M25 3 l12 10 m8-10 12 10 m8-10 12 10 m8-10 12 10 m8-10 12 10" stroke="#5b636b"/>
    </g>
    <g transform="translate(760 602) rotate(-8)">
      <rect x="0" y="0" width="140" height="15" rx="7"/>
      <circle cx="7" cy="7.5" r="15"/>
      <path d="M7 1 V14 M1 7.5 H13" stroke="#20252a" stroke-width="3"/>
    </g>
    <g transform="translate(685 635) rotate(11)">
      <rect x="0" y="0" width="125" height="14" rx="7"/>
      <circle cx="7" cy="7" r="14"/>
      <path d="M7 1 V13 M1 7 H13" stroke="#20252a" stroke-width="3"/>
    </g>
  </g>

  <!-- black drywall screws -->
  <g fill="#16191e" stroke="#08090b" stroke-width="2" opacity=".96" filter="url(#smallShadow)">
    <g transform="translate(305 615) rotate(13)"><rect width="128" height="13" rx="6"/><circle cx="8" cy="6.5" r="14"/></g>
    <g transform="translate(335 660) rotate(-8)"><rect width="115" height="12" rx="6"/><circle cx="8" cy="6" r="13"/></g>
    <g transform="translate(250 680) rotate(-19)"><rect width="108" height="12" rx="6"/><circle cx="8" cy="6" r="13"/></g>
    <g transform="translate(390 620) rotate(26)"><rect width="108" height="12" rx="6"/><circle cx="8" cy="6" r="13"/></g>
  </g>

  <!-- anchors -->
  <g transform="translate(500 630)" fill="#aeb4bb" filter="url(#smallShadow)">
    <path d="M0 0 h30 l14 22 -14 22 H0 l12-22 Z"/>
    <path d="M54 7 h30 l14 22 -14 22 H54 l12-22 Z"/>
    <path d="M108 -8 h30 l14 22 -14 22 h-30 l12-22 Z"/>
  </g>

  <!-- metal brackets -->
  <g transform="translate(920 565)" fill="url(#steel)" stroke="#5b636b" stroke-width="3" filter="url(#smallShadow)">
    <path d="M0 0 h120 v36 H75 v95 H35 V36 H0 Z"/>
    <circle cx="22" cy="18" r="7" fill="#242a30"/>
    <circle cx="98" cy="18" r="7" fill="#242a30"/>
    <circle cx="55" cy="82" r="7" fill="#242a30"/>
  </g>

  <!-- subtle premium highlight -->
  <rect x="0" y="0" width="1200" height="800" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
</svg>