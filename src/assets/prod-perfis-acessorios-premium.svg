<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Perfis e acessórios para drywall e steel frame</title>
  <desc id="desc">Perfis galvanizados, fita, parafusos, cantoneiras e acessórios em ambiente de loja de materiais para construção a seco.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9e0e5"/><stop offset="1" stop-color="#f4f1ea"/></linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8d3ca"/><stop offset="1" stop-color="#bdb7ae"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48616a"/><stop offset="0.2" stop-color="#dce7ec"/><stop offset="0.45" stop-color="#708a94"/><stop offset="0.72" stop-color="#eef3f5"/><stop offset="1" stop-color="#57707a"/></linearGradient>
    <linearGradient id="steel2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a7bbc4"/><stop offset="0.45" stop-color="#f1f5f7"/><stop offset="1" stop-color="#637d87"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity=".22"/></filter>
  </defs>

  <rect width="1200" height="800" fill="url(#wall)"/>
  <rect y="505" width="1200" height="295" fill="url(#counter)"/>

  <!-- warehouse / store background -->
  <g opacity=".82">
    <rect x="0" y="0" width="1200" height="105" fill="#cbd3d8"/>
    <rect x="710" y="55" width="310" height="315" rx="6" fill="#184c7a"/>
    <rect x="728" y="75" width="274" height="54" fill="#d9dee2"/>
    <rect x="728" y="148" width="274" height="54" fill="#c8cdd1"/>
    <rect x="728" y="221" width="274" height="54" fill="#d9dee2"/>
    <rect x="728" y="294" width="274" height="54" fill="#c8cdd1"/>
    <rect x="780" y="75" width="8" height="273" fill="#f47b20"/>
    <rect x="950" y="75" width="8" height="273" fill="#f47b20"/>
    <g fill="#9ca7ad"><circle cx="800" cy="350" r="44"/><circle cx="905" cy="350" r="44"/><circle cx="1010" cy="350" r="44"/></g>
    <g fill="#f4f2ec"><rect x="1010" y="85" width="190" height="50"/><rect x="1010" y="148" width="190" height="50"/><rect x="1010" y="211" width="190" height="50"/><rect x="1010" y="274" width="190" height="50"/></g>
    <g fill="#8c979e"><rect x="45" y="45" width="36" height="390"/><rect x="105" y="35" width="31" height="400"/><rect x="162" y="48" width="39" height="387"/><rect x="225" y="42" width="32" height="393"/></g>
  </g>

  <!-- stacked profiles -->
  <g filter="url(#shadow)" transform="translate(35 115)">
    <g transform="translate(0 0)">
      <path d="M0 35 H530 L585 72 H90 L63 145 H520 L565 183 H38 L0 145 Z" fill="url(#steel)"/>
      <path d="M63 145 H520 L565 183 H38 Z" fill="#3d535c" opacity=".75"/>
      <path d="M92 84 H500" stroke="#edf4f7" stroke-width="5" opacity=".58"/>
    </g>
    <g transform="translate(18 112)">
      <path d="M0 35 H510 L562 70 H86 L61 136 H497 L540 172 H36 L0 136 Z" fill="url(#steel2)"/>
      <path d="M61 136 H497 L540 172 H36 Z" fill="#405963" opacity=".72"/>
      <path d="M90 82 H482" stroke="#f4f8fa" stroke-width="5" opacity=".55"/>
    </g>
    <g transform="translate(40 222)">
      <path d="M0 35 H470 L516 66 H82 L57 124 H455 L493 158 H34 L0 124 Z" fill="url(#steel)"/>
      <path d="M57 124 H455 L493 158 H34 Z" fill="#3f555f" opacity=".7"/>
    </g>
  </g>

  <!-- joint tape roll -->
  <g transform="translate(775 300)" filter="url(#smallShadow)">
    <ellipse cx="120" cy="86" rx="112" ry="66" fill="#ece7dc"/>
    <ellipse cx="120" cy="86" rx="68" ry="40" fill="#bbb5aa"/>
    <ellipse cx="120" cy="86" rx="42" ry="25" fill="#7b7770"/>
    <path d="M8 86 V168 C8 205 232 205 232 168 V86 C204 130 38 130 8 86Z" fill="#ddd8cc"/>
    <ellipse cx="120" cy="168" rx="112" ry="57" fill="#d2ccc0"/>
    <ellipse cx="120" cy="168" rx="45" ry="23" fill="#88837a"/>
  </g>

  <!-- perforated corner bead -->
  <g transform="translate(770 525) rotate(-4)" fill="#dfe7ea" stroke="#899aa2" stroke-width="2" filter="url(#smallShadow)">
    <rect x="0" y="0" width="355" height="44" rx="6"/>
    <g fill="#98a8af">
      <circle cx="22" cy="22" r="5"/><circle cx="50" cy="22" r="5"/><circle cx="78" cy="22" r="5"/><circle cx="106" cy="22" r="5"/><circle cx="134" cy="22" r="5"/><circle cx="162" cy="22" r="5"/><circle cx="190" cy="22" r="5"/><circle cx="218" cy="22" r="5"/><circle cx="246" cy="22" r="5"/><circle cx="274" cy="22" r="5"/><circle cx="302" cy="22" r="5"/><circle cx="330" cy="22" r="5"/>
    </g>
  </g>

  <!-- metal brackets -->
  <g transform="translate(635 520)" fill="url(#steel2)" stroke="#687a82" stroke-width="2" filter="url(#smallShadow)">
    <path d="M0 0 h64 v26 H42 v76 H20 V26 H0 Z"/>
    <path d="M92 8 h62 v24 H133 v70 H111 V32 H92 Z"/>
    <path d="M178 0 h60 v24 H218 v78 H197 V24 H178 Z"/>
    <circle cx="20" cy="14" r="5" fill="#5a6a72"/><circle cx="112" cy="20" r="5" fill="#5a6a72"/><circle cx="198" cy="14" r="5" fill="#5a6a72"/>
  </g>

  <!-- black drywall screws -->
  <g fill="#15191c" stroke="#07090a" stroke-width="2" filter="url(#smallShadow)">
    <g transform="translate(330 655) rotate(-14)"><rect width="112" height="12" rx="6"/><circle cx="8" cy="6" r="13"/></g>
    <g transform="translate(375 685) rotate(8)"><rect width="105" height="12" rx="6"/><circle cx="8" cy="6" r="13"/></g>
    <g transform="translate(300 708) rotate(-25)"><rect width="102" height="11" rx="6"/><circle cx="8" cy="5.5" r="12"/></g>
    <g transform="translate(425 650) rotate(20)"><rect width="108" height="12" rx="6"/><circle cx="8" cy="6" r="13"/></g>
    <g transform="translate(465 706) rotate(-6)"><rect width="100" height="11" rx="6"/><circle cx="8" cy="5.5" r="12"/></g>
  </g>

  <!-- anchors -->
  <g transform="translate(530 670)" fill="#adb7bd" filter="url(#smallShadow)">
    <path d="M0 0 h25 l14 20 -14 20 H0 l10-20 Z"/>
    <path d="M48 5 h25 l14 20 -14 20 H48 l10-20 Z"/>
    <path d="M96 -2 h25 l14 20 -14 20 H96 l10-20 Z"/>
  </g>

  <rect x="8" y="8" width="1184" height="784" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="4"/>
</svg>